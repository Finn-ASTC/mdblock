<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>mdblock 敌意宿主页</title>
<style>
  /* ── 第一层：真实世界的宿主页面 ──────────────────────────────────────
     Tailwind preflight 风格的全局 reset + 常见的壳层样式。
     全部是普通特异性、无 !important —— 这是文章块真正要活下来的环境。 */
  *, ::before, ::after { box-sizing: border-box; }
  * { margin: 0; padding: 0; }
  body {
    font-family: cursive;
    font-size: 14px;
    line-height: 2.4;
    letter-spacing: 0.35em;      /* 宿主排字癖：普通块会被继承 */
    text-transform: uppercase;   /* 同上 */
    color: #b00;
    background: #f6f6f6;
    padding: 24px;
  }
  h1, h2, h3 { font-size: 13px; color: #06c; }
  p { line-height: 1.1; }
  a { color: #00f; text-decoration: none; }
  a:hover { color: #0a0; }
  img { max-width: 16px; }
  ul, ol { list-style: none; padding-left: 0; }
  table { border-collapse: separate; border-spacing: 8px; }
  th, td { border: 3px dotted hotpink; text-align: right; }
  code, pre {
    font-family: cursive;
    background: yellow;
    color: navy;
    padding: 10px;
  }
  blockquote { border-left: 8px solid lime; padding: 0 40px; background: pink; }
  hr { height: 12px; background: orange; }
  /* 高特异性宿主规则：命名空间选择器（0,2,1）压过我们的 .mdblock p（0,1,1） */
  .article-body .prose p { line-height: 1.05; color: #808080; }
  .article-body .prose a { color: #d00; }

  .host-note { color: #333; font-size: 12px; letter-spacing: normal; text-transform: none;
               font-family: ui-sans-serif, system-ui, sans-serif; line-height: 1.6;
               margin: 0 0 10px; }
  .host-note code { padding: 1px 4px; background: #eee; color: #333; font-family: monospace; }
</style>
</head>
<body>

<p class="host-note">
  这是<b>敌意宿主页</b>：全局 reset（<code>*{margin:0;padding:0}</code>）、
  <code>body</code> 上的 <code>letter-spacing:.35em</code> / <code>text-transform:uppercase</code> /
  花体字体、加料的表格/代码/引用样式，以及一条高特异性规则
  <code>.article-body .prose p</code>。所有样式故意写得很丑 —— 只有文章块必须不受影响。
</p>

<div class="article-body">
  <div class="prose">

    <p class="host-note">A · catppuccin-latte · 普通隔离</p>
    <!--MD-BLOCK-A-->

    <p class="host-note">B · catppuccin-mocha · 普通隔离（验证同页多主题共存）</p>
    <!--MD-BLOCK-B-->

    <p class="host-note">C · nord · <code>--hard-isolation</code>（验证 all:revert 的效果）</p>
    <!--MD-BLOCK-C-->

  </div>
</div>

</body>
</html>
